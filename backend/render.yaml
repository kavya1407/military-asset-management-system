services:
  - type: web
    name: military-asset-management-api
    env: node
    plan: free
    buildCommand: npm install && node src/db/seed.js
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
